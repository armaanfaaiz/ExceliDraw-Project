name: excelidraw
region: nyc

services:
  # HTTP Backend Service
  - name: http-backend
    source_dir: apps/http-backend
    github:
      repo: armaanfaaiz/ExceliDraw-Project
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 3002
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    envs:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        type: SECRET
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET
      - key: PORT
        value: "3002"
      - key: FRONTEND_URL
        value: ${FRONTEND_URL}

  # WebSocket Backend Service
  - name: ws-backend
    source_dir: apps/ws-backend
    github:
      repo: armaanfaaiz/ExceliDraw-Project
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: DATABASE_URL
        value: ${DATABASE_URL}
        type: SECRET
      - key: JWT_SECRET
        value: ${JWT_SECRET}
        type: SECRET
      - key: PORT
        value: "8080"

  # Frontend (Static Site)
  - name: frontend
    source_dir: apps/excelidraw-frontend
    github:
      repo: armaanfaaiz/ExceliDraw-Project
      branch: main
      deploy_on_push: true
    build_command: |
      cd ../.. && pnpm install && pnpm build --filter=excelidraw-frontend
    output_dir: apps/excelidraw-frontend/.next
    envs:
      - key: NEXT_PUBLIC_HTTP_BACKEND
        value: ${HTTP_BACKEND_URL}
      - key: NEXT_PUBLIC_WS_URL
        value: ${WS_BACKEND_URL}

static_sites:
  - name: frontend-static
    source_dir: apps/excelidraw-frontend
    build_command: |
      cd ../.. && pnpm install && pnpm build --filter=excelidraw-frontend
    output_dir: apps/excelidraw-frontend/.next
    index_document: index.html
    error_document: index.html
    catchall_document: index.html
    envs:
      - key: NEXT_PUBLIC_HTTP_BACKEND
        value: ${HTTP_BACKEND_URL}
      - key: NEXT_PUBLIC_WS_URL
        value: ${WS_BACKEND_URL}
